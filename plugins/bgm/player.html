<!-- ClearLove 背景音乐播放器（由插件 bgm 注入到 footer_html） -->
<div id="clv-bgm" hidden
     data-src="{config:music}"
     data-vol="{config:volume}"
     data-auto="{config:autoplay}"
     data-loop="{config:loop}"
     data-pos="{config:pos}">
  <audio id="clv-bgm-audio" preload="auto" playsinline></audio>
  <button id="clv-bgm-btn" type="button" aria-label="播放背景音乐" aria-pressed="false">
    <svg class="bgm-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M9 17.5V5.8l10-2v11.7"/><circle cx="6.6" cy="17.8" r="2.6"/><circle cx="16.6" cy="15.5" r="2.6"/></svg>
    <svg class="bgm-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M9 17.5V5.8l10-2v11.7"/><circle cx="6.6" cy="17.8" r="2.6"/><circle cx="16.6" cy="15.5" r="2.6"/><path d="M3.5 3.5l17 17"/></svg>
  </button>
  <span id="clv-bgm-tip" hidden>点击开启背景音乐</span>
</div>
<style>
#clv-bgm{position:fixed;z-index:900;bottom:22px;display:flex;align-items:center;gap:8px;animation:clv-bgm-in .45s ease both}
#clv-bgm[hidden]{display:none!important}
#clv-bgm.pos-right{right:18px;flex-direction:row-reverse}
#clv-bgm.pos-left{left:18px}
#clv-bgm-btn{width:46px;height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:50%;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--clv-accent,#ff7a9c),var(--clv-accent-2,#8a6cff));box-shadow:0 8px 22px rgba(0,0,0,.22)}
#clv-bgm-btn:focus-visible{outline:2px solid var(--clv-accent);outline-offset:2px}
#clv-bgm-btn svg{width:22px;height:22px}
#clv-bgm-btn .bgm-off{display:none}
#clv-bgm.paused #clv-bgm-btn .bgm-on{display:none}
#clv-bgm.paused #clv-bgm-btn .bgm-off{display:block}
#clv-bgm.playing #clv-bgm-btn{animation:clv-bgm-pulse 2.4s ease-in-out infinite}
#clv-bgm-tip{font-size:12px;padding:5px 10px;border-radius:999px;white-space:nowrap;background:var(--clv-card,#fff);color:var(--clv-text,#23262f);border:1px solid var(--clv-border,rgba(0,0,0,.1));box-shadow:0 6px 16px rgba(0,0,0,.12)}
@keyframes clv-bgm-in{from{opacity:0}to{opacity:1}}
@keyframes clv-bgm-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#clv-bgm.playing #clv-bgm-btn{animation:none}}
@media (max-width:480px){#clv-bgm-btn{width:42px;height:42px}}
</style>
<script>
(function () {
  var box = document.getElementById('clv-bgm');
  if (!box) return;
  var audio = document.getElementById('clv-bgm-audio');
  var btn = document.getElementById('clv-bgm-btn');
  var tip = document.getElementById('clv-bgm-tip');
  var src = (box.getAttribute('data-src') || '').trim();
  if (!src) return; // 未上传音乐：播放器不出现

  audio.src = src;
  audio.loop = box.getAttribute('data-loop') === '1';
  var v = parseInt(box.getAttribute('data-vol'), 10);
  audio.volume = Math.min(1, Math.max(0, (isNaN(v) ? 35 : v) / 100));
  box.className = box.getAttribute('data-pos') === '左下' ? 'pos-left' : 'pos-right';

  var ON = 'clv_bgm_on', POS = 'clv_bgm_pos';
  function get(k, sess) { try { return (sess ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } }
  function set(k, val, sess) { try { (sess ? sessionStorage : localStorage).setItem(k, val); } catch (e) { } }

  // 访客的开关优先，其次才是后台的「自动播放」设置
  var saved = get(ON);
  var on = saved === null ? box.getAttribute('data-auto') === '1' : saved === '1';
  var armed = false, tipTimer = null;

  function render() {
    var playing = !audio.paused && !audio.ended;
    box.classList.toggle('playing', playing);
    box.classList.toggle('paused', !playing);
    btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    btn.setAttribute('aria-label', playing ? '暂停背景音乐' : '播放背景音乐');
  }

  // 浏览器要求音频必须由用户手势触发：监听一次全局交互再播
  function armGesture() {
    if (armed) return;
    armed = true;
    var fire = function () {
      document.removeEventListener('pointerdown', fire, true);
      document.removeEventListener('keydown', fire, true);
      armed = false;
      if (on && audio.paused) play(true);
    };
    document.addEventListener('pointerdown', fire, true);
    document.addEventListener('keydown', fire, true);
  }

  function showTip() {
    tip.hidden = false;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { tip.hidden = true; }, 10000);
  }

  function play(byGesture) {
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        // 自动播放被拦截：提示访客，并在其首次交互时自动开始
        if (!byGesture) { showTip(); armGesture(); }
        render();
      });
    }
  }

  btn.addEventListener('click', function () {
    if (audio.paused) {
      on = true;
      set(ON, '1');
      tip.hidden = true;
      play(true);
    } else {
      on = false;
      set(ON, '0');
      audio.pause();
    }
    render();
  });

  audio.addEventListener('play', render);
  audio.addEventListener('pause', render);
  // 文件缺失或格式不支持时直接隐藏，避免留下一个点不动的按钮
  audio.addEventListener('error', function () { box.hidden = true; });

  // 记录播放进度，站内翻页后接着播
  var lastSave = 0;
  audio.addEventListener('timeupdate', function () {
    if (Math.abs(audio.currentTime - lastSave) >= 1) {
      lastSave = audio.currentTime;
      set(POS, String(audio.currentTime), true);
    }
  });
  window.addEventListener('pagehide', function () { set(POS, String(audio.currentTime), true); });
  var resume = parseFloat(get(POS, true));
  if (isFinite(resume) && resume > 0) {
    audio.addEventListener('loadedmetadata', function () {
      try { if (!audio.duration || resume < audio.duration) audio.currentTime = resume; } catch (e) { }
    });
  }

  // 自动避开右下角的发帖悬浮按钮，避免两个按钮叠在一起
  function place() {
    var fab = document.querySelector('.fab');
    var right = box.classList.contains('pos-right');
    var r = fab ? fab.getBoundingClientRect() : null;
    var sameSide = r && r.width > 0 && (right ? window.innerWidth - r.right < 90 : r.left < 90);
    box.style.bottom = sameSide ? Math.round(window.innerHeight - r.top + 12) + 'px' : '';
  }

  box.hidden = false;
  place();
  window.addEventListener('resize', place);
  render();
  if (on) play(false);
})();
</script>
