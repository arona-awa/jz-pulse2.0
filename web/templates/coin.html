{{define "tip_modal"}}
<div class="tip-modal" id="tip-modal" hidden>
  <div class="tip-backdrop" data-tip-close></div>
  <section class="tip-sheet" role="dialog" aria-modal="true" aria-labelledby="tip-title">
    <h2 id="tip-title" class="sr-only">投币支持</h2>
    <button class="tip-close" type="button" data-tip-close aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="tip-carousel">
      <button class="tip-nav prev" type="button" data-tip-nav="-1" aria-label="选择 1 枚硬币">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4 1.6-1.6L11.2 12 17 6.2z"/></svg>
      </button>
      <div class="tip-options" role="group" aria-label="选择投币数量">
        <button class="tip-option is-selected" type="button" data-coins="1">
          <span class="tip-brick">
            <i class="tip-screw tl"></i><i class="tip-screw tr"></i><i class="tip-screw bl"></i><i class="tip-screw br"></i>
            <img class="tip-brick-coin" src="/static/coin.svg?v={{.clvVersion}}" alt="" width="62" height="62">
          </span>
          <span class="tip-option-label">1 硬币</span>
        </button>
        <button class="tip-option" type="button" data-coins="2">
          <span class="tip-brick">
            <i class="tip-screw tl"></i><i class="tip-screw tr"></i><i class="tip-screw bl"></i><i class="tip-screw br"></i>
            <img class="tip-brick-coin pair one" src="/static/coin.svg?v={{.clvVersion}}" alt="" width="62" height="62">
            <img class="tip-brick-coin pair two" src="/static/coin.svg?v={{.clvVersion}}" alt="" width="62" height="62">
          </span>
          <span class="tip-option-label">2 硬币</span>
        </button>
      </div>
      <span class="tip-lightning" id="tip-lightning" aria-hidden="true"></span>
      <button class="tip-nav next" type="button" data-tip-nav="1" aria-label="选择 2 枚硬币">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8.6 4.6 16 12l-7.4 7.4-1.6-1.6L12.8 12 7 6.2z"/></svg>
      </button>
    </div>

    <div class="tip-stage" id="tip-stage" role="button" tabindex="0" aria-label="向上滑动或点击小人投币">
      <img class="tip-girl" src="/static/coin-girl.webp?v={{.clvVersion}}" alt="" draggable="false">
    </div>

    <p class="tip-hint">上滑或点击小人投硬币</p>
    <p class="tip-balance-line">硬币余额：<b id="tip-balance-text">{{coins .user.CoinTenths}}</b></p>

    <div class="tip-bottom">
      <label class="tip-like"><input type="checkbox" id="tip-like"> 同时点赞内容</label>
      <a class="tip-help" href="/manual#coin" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.5M12 17h.01"/></svg>
        如何获取硬币？
      </a>
    </div>
    <p class="tip-msg" id="tip-msg" role="status" aria-live="polite"></p>
  </section>
</div>
{{end}}
